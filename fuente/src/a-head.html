<style>
/* ============ DESIGN TOKENS ============ */
:root{

  /* Semantic (light) */
  --bg:var(--sand); --surface:var(--white); --surface-2:#FBF8F2;
  --text:var(--navy-800); --text-muted:var(--slate);
  --accent:var(--gold-500); --accent-text:var(--gold-700);
  --border:var(--taupe); --border-strong:#D6C3A0;
  --inverse-bg:var(--navy-800); --inverse-text:var(--sand); --inverse-muted:var(--navy-300); --inverse-accent:var(--gold-400);

  /* Typography */
  --font-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --font-heading:"Inter",system-ui,sans-serif;
  --fs-h1:clamp(2.5rem,1.6rem + 3.9vw,4.5rem);
  --fs-h2:clamp(2rem,1.5rem + 2.2vw,3rem);
  --fs-h3:clamp(1.5rem,1.3rem + .9vw,2rem);
  --fs-h4:clamp(1.25rem,1.15rem + .45vw,1.5rem);
  --fs-h5:clamp(1.125rem,1.08rem + .2vw,1.25rem);
  --fs-eyebrow:.8125rem;
  --fs-body:clamp(1rem,.96rem + .2vw,1.125rem);
  --fs-lead:clamp(1.125rem,1.05rem + .35vw,1.3125rem);
  --fs-small:.9375rem; --fs-caption:.8125rem;

  /* Spacing (8px base) */
  --s-1:8px; --s-2:16px; --s-3:24px; --s-4:32px; --s-6:48px; --s-8:64px; --s-12:96px; --s-16:128px;
  --section-y:clamp(64px,5vw + 40px,128px);
  --gutter:clamp(16px,2vw + 8px,32px);

  /* Shape & depth */
  --r-sm:2px; --r-md:4px; --r-lg:6px; --r-pill:3px;

  --shadow-3:0 24px 56px rgba(11,37,69,.18),0 6px 16px rgba(11,37,69,.08);

  /* Motion */
  --ease:cubic-bezier(.2,.7,.2,1);
  --t-fast:200ms; --t-med:300ms; --t-slow:400ms;
}

/* Dark mode: automatic by system preference */

    --bg:var(--navy-900); --surface:var(--navy-700); --surface-2:#0C2242;

/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box}

.eyebrow--center{align-items:center}

/* ============ LAYOUT: GRID & HELPERS ============ */
.container{width:100%;max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter)}
.section{padding-block:var(--section-y);position:relative}
.section--inverse{background:var(--inverse-bg);color:var(--inverse-text)}

.section-head{display:grid;gap:var(--s-3);max-width:760px;margin-bottom:var(--s-8)}
.section-head--center{margin-inline:auto;text-align:center;justify-items:center}
.grid{display:grid;gap:var(--s-3)}
.grid-2,.grid-3,.grid-4{display:grid;gap:var(--s-3);grid-template-columns:1fr}
@media (min-width:768px){.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}.grid-2,.grid-3,.grid-4{gap:var(--s-4)}}
.stack{display:flex;flex-direction:column;gap:var(--s-2)}

.center{text-align:center}
.muted{color:var(--text-muted)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.skip-link:focus{transform:none}
.gold-diagonal{position:absolute;pointer-events:none;width:2px;background:linear-gradient(180deg,transparent,var(--gold-500) 20%,var(--gold-400) 80%,transparent);transform:rotate(22deg);transform-origin:top}

/* ============ BUTTONS ============ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:14px 28px;border-radius:var(--r-sm);font-family:var(--font-body);font-size:.875rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;white-space:nowrap;overflow:hidden;isolation:isolate;transition:transform var(--t-med) var(--ease),box-shadow var(--t-med) var(--ease),background-color var(--t-med) var(--ease),color var(--t-med) var(--ease),border-color var(--t-med) var(--ease)}
