<script>
/* =====================================================================
   NOVA — site scripts (Block G). Everything is progressive enhancement:
   without JS all content stays visible and links/forms still work.
   ===================================================================== */
(() => {
  const $ = (s, c = document) => c.querySelector(s);
  const $$ = (s, c = document) => [...c.querySelectorAll(s)];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- i18n: EN / ES / PT (dictionary generated at build) ---------- */
  const I18N = {{I18N}};
  let LANG = 'en';
  const t = (str, vars) => {
    let r = (LANG !== 'en' && I18N[LANG] && I18N[LANG][str]) || str;
    if (vars) Object.keys(vars).forEach(k => { r = r.split('{' + k + '}').join(vars[k]); });
    return r;
  };
  window.novaT = t;
  const origText = new WeakMap(), origAttr = new WeakMap(), I18N_ATTRS = ['aria-label', 'alt', 'data-caption', 'title'];
  const translatePage = () => {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => {
      const p = n.parentElement;
      if (!p || p.closest('script,style,svg,[data-no-i18n]')) return NodeFilter.FILTER_REJECT;
      return (origText.has(n) || /[A-Za-z]/.test(n.nodeValue)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; } });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      if (!origText.has(n)) origText.set(n, n.nodeValue);
      const en = origText.get(n), key = (n.parentElement.dataset.t || en.replace(/\s+/g, ' ').trim()), tr = t(key);
      if (LANG === 'en' || tr === key) { n.nodeValue = en; return; }
      const lead = en.match(/^\s*/)[0], trail = en.match(/\s*$/)[0];
      n.nodeValue = (/^[.,;:!?]/.test(tr) ? '' : lead) + tr + trail;
    });
    $$(I18N_ATTRS.map(a => `[${a}]`).join(',')).forEach(el => {
      if (el.closest('svg') && el.tagName !== 'svg') return;
      let o = origAttr.get(el); if (!o) { o = {}; I18N_ATTRS.forEach(a => { if (el.hasAttribute(a)) o[a] = el.getAttribute(a); }); origAttr.set(el, o); }
      Object.keys(o).forEach(a => el.setAttribute(a, LANG === 'en' ? o[a] : t(o[a])));
    });
  };
  const META = { title: document.title, desc: ($('meta[name=description]') || {}).content };
  const setLang = (lang) => {
    LANG = ['en', 'es', 'pt'].includes(lang) ? lang : 'en';
    document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : LANG;
    translatePage();
    document.title = LANG === 'en' ? META.title : t('__title');
    const md = $('meta[name=description]'); if (md) md.content = LANG === 'en' ? META.desc : t('__desc');
    $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
    document.dispatchEvent(new CustomEvent('nova:lang', { detail: LANG }));
  };
  $$('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  // Always opens in English. Only an explicit link like ?lang=es or ?lang=pt opens another language.
  const initialLang = new URLSearchParams(location.search).get('lang') || 'en';

  /* ---------- Navbar: color transition on scroll ---------- */
  const nav = $('#nav');
  const onScroll = () => nav && nav.classList.toggle('is-scrolled', scrollY > 24);
  addEventListener('scroll', onScroll, { passive: true }); onScroll();

  /* ---------- Mobile menu ---------- */
  const mnav = $('#mnav'), openBtn = $('.nav .nav__toggle');
  if (mnav && openBtn) {
    const open = () => {
      mnav.hidden = false; requestAnimationFrame(() => mnav.classList.add('is-open'));
      openBtn.setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden';
      $('[data-close]', mnav).focus();
    };
    const close = (focusBack = true) => {
      mnav.classList.remove('is-open'); openBtn.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
      setTimeout(() => { mnav.hidden = true; }, reduce ? 0 : 400);
      if (focusBack) openBtn.focus();
    };
    openBtn.addEventListener('click', open);
    $('[data-close]', mnav).addEventListener('click', () => close());
    $$('a', mnav).forEach(a => a.addEventListener('click', () => close(false)));
    addEventListener('keydown', e => { if (e.key === 'Escape' && !mnav.hidden) close(); });
    mnav.addEventListener('keydown', e => { // focus trap
      if (e.key !== 'Tab') return;
      const f = $$('a,button', mnav), first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
  }

  /* ---------- Subtle parallax (hero) ---------- */
  const par = $$('[data-parallax]');
  if (par.length && !reduce) {
    let ticking = false;
    const run = () => {
      const y = scrollY;
      if (y < innerHeight * 1.2) par.forEach(el => {
        const base = el.classList.contains('hero__stripe') ? ' skewX(-24deg)' : '';
        el.style.transform = `translate3d(0,${(y * parseFloat(el.dataset.parallax)).toFixed(1)}px,0)${base}`;
      });
      ticking = false;
    };
    addEventListener('scroll', () => { if (!ticking) { requestAnimationFrame(run); ticking = true; } }, { passive: true });
  }

  /* ---------- Animated counters (0 → value) ---------- */
  const counters = $$('[data-count]');
  const animateCount = el => {
    const end = parseFloat(el.dataset.count), dur = 1400, t0 = performance.now();
    const step = t => {
      const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(end * e).toLocaleString('en-US');
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  if (counters.length && 'IntersectionObserver' in window && !reduce) {
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) { animateCount(en.target); io.unobserve(en.target); }
    }), { threshold: .6 });
    counters.forEach(c => io.observe(c));
  }


  /* ---------- Line icons that draw themselves (Web Animations API) ---------- */
  if (!reduce && 'IntersectionObserver' in window && Element.prototype.animate) {
    const draw = (paths, base = 200, gap = 150) => paths.forEach(el => {
      const k = parseFloat(getComputedStyle(el).getPropertyValue('--k')) || 0;
      el.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
        { duration: 1100, delay: base + k * gap, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' });
    });
    $$('.anim-icon').forEach(svg => {
      const paths = $$('[pathLength]', svg);
      paths.forEach(el => { el.style.strokeDasharray = '1'; el.style.strokeDashoffset = '1'; });
      const io = new IntersectionObserver(([en]) => {
        if (en.isIntersecting) { draw(paths); io.disconnect(); }
      }, { threshold: .6 });
      io.observe(svg);
      const card = svg.closest('.card');
      if (card) card.addEventListener('mouseenter', () => draw(paths, 0, 90));
    });
  }


  /* ---------- Growth Plan window: honest countdown to month end (+ optional real spots) ---------- */
  $$('.spots').forEach(s => {
    const now = new Date(), lbl = $('[data-spots-label]', s);
    const setLabel = () => { if (lbl) lbl.textContent = t('{month} Growth Plans close in', { month: now.toLocaleString(LANG === 'pt' ? 'pt-BR' : LANG, { month: 'long' }) }).replace(/^./, c => c.toUpperCase()); };
    setLabel(); document.addEventListener('nova:lang', setLabel);
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const pad = n => String(n).padStart(2, '0');
    const tick = () => {
      let t = Math.max(0, end - new Date()) / 1000;
      const d = Math.floor(t / 86400); t -= d * 86400; const h = Math.floor(t / 3600); t -= h * 3600;
      const mi = Math.floor(t / 60), se = Math.floor(t - mi * 60);
      [['d', d], ['h', h], ['m', mi], ['s', se]].forEach(([k, v]) => { const el = $(`[data-cd="${k}"]`, s); if (el) el.textContent = pad(v); });
    };
    tick(); setInterval(tick, 1000);
    if (s.dataset.left !== '' && !isNaN(+s.dataset.left)) {   // only if the team entered a real number
      const total = +s.dataset.total || 7, left = Math.max(0, Math.min(total, +s.dataset.left));
      const meter = $('.spots__meter', s); meter.hidden = false; $('[data-spots-count]', s).hidden = false;
      $('[data-spots-left]', s).textContent = left;
      for (let i = 0; i < total; i++) { const x = document.createElement('i'); if (i >= left) x.className = 'is-taken'; meter.appendChild(x); }
    }
  });

  /* ---------- Process: rail fills + active steps while scrolling ---------- */
  const stepsEl = $('#steps');
  if (stepsEl) {
    const rail = $('.steps__rail i', stepsEl), steps = $$('.step', stepsEl);
    const update = () => {
      const r = stepsEl.getBoundingClientRect(), vh = innerHeight;
      const desktop = matchMedia('(min-width:1024px)').matches;
      let p = desktop ? (vh * .85 - r.top) / (vh * .5) : (vh * .6 - r.top) / r.height;
      p = Math.max(0, Math.min(1, p));
      rail.style.setProperty('--p', reduce ? 1 : p.toFixed(3));
      steps.forEach((s, i) => s.classList.toggle('is-active', p >= (desktop ? i / (steps.length - 1) - .001 : i / steps.length)));
    };
    addEventListener('scroll', () => requestAnimationFrame(update), { passive: true }); update();
  }

  /* ---------- Growth Leak Check (quiz) ---------- */
  const quiz = $('#leak-check');
  if (quiz) {
    const Q = [
      { area: 'Visibility', q: 'When someone searches for your service in your area, where do you show up?',
        o: [['At the top of Google and Maps', 2], ['Somewhere, but I\'m not sure where', 1], ['Hardly anywhere', 0]] },
      { area: 'Trust', q: 'How many Google reviews does your business have?',
        o: [['50+ and growing every month', 2], ['Some, but we rarely ask for them', 1], ['Few or none', 0]] },
      { area: 'Acquisition', q: 'Where do most of your new customers come from?',
        o: [['Several predictable channels', 2], ['Mostly word of mouth', 1], ['Honestly, it\'s unpredictable', 0]] },
      { area: 'Conversion', q: 'How fast do you respond to a new inquiry?',
        o: [['Within minutes, every time', 2], ['Same day, usually', 1], ['When we get to it', 0]] },
      { area: 'Efficiency', q: 'How much of your week goes to repetitive admin work?',
        o: [['Very little, it\'s mostly automated', 2], ['A few hours', 1], ['Way too much', 0]] }
    ];
    const TIPS = {
      Visibility: 'Strengthen your Google profile, local SEO and website first.',
      Trust: 'Start a steady review system and a more professional brand.',
      Acquisition: 'Add predictable channels beyond word of mouth.',
      Conversion: 'Respond faster and automate follow-up. Leads that wait, leave.',
      Efficiency: 'Automate the repetitive admin that eats your week.'
    };
    const body = $('[data-quiz-body]', quiz), bar = $('[data-quiz-bar]', quiz), count = $('[data-quiz-count]', quiz);
    let answers = [], idx = 0, mode = 'intro';
    const arrow = '<svg aria-hidden="true"><use href="#i-arrow"/></svg>';
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const render = (quiet) => {
      const item = Q[idx];
      bar.style.setProperty('--w', (idx / Q.length * 100) + '%');
      mode = 'q'; count.textContent = t('Question {n} of {t}', { n: idx + 1, t: Q.length });
      body.innerHTML = `<div class="quiz__step"><div class="quiz__area">${t(item.area)}</div>
        <p class="quiz__q" id="qq">${esc(t(item.q))}</p>
        <div class="quiz__opts" role="group" aria-labelledby="qq">${item.o.map((o, i) =>
          `<button type="button" class="quiz__opt" data-i="${i}" aria-pressed="${answers[idx] === i}">${esc(t(o[0]))}</button>`).join('')}</div>
        <div class="quiz__nav"><button type="button" class="quiz__back" ${idx === 0 ? 'disabled' : ''}>${t('← Back')}</button></div></div>`;
      $$('.quiz__opt', body).forEach(b => b.addEventListener('click', () => {
        answers[idx] = +b.dataset.i;
        $$('.quiz__opt', body).forEach(x => x.setAttribute('aria-pressed', x === b));
        setTimeout(() => { idx++; idx < Q.length ? render() : result(); }, reduce ? 0 : 260);
      }));
      $('.quiz__back', body).addEventListener('click', () => { idx = Math.max(0, idx - 1); render(); });
      if (!quiet) $('.quiz__opt', body).focus({ preventScroll: true });
    };
    const result = (silent) => {
      const scores = Q.map((item, i) => ({ area: item.area, v: item.o[answers[i]][1] * 50 }));
      const min = Math.min(...scores.map(s => s.v));
      // tie-break: Conversion first (cheapest leak to fix), then the rest in journey order
      const order = ['Conversion', 'Visibility', 'Trust', 'Acquisition', 'Efficiency'];
      const leak = order.find(a => scores.find(s => s.area === a).v === min);
      const total = Math.round(scores.reduce((a, s) => a + s.v, 0) / scores.length);
      bar.style.setProperty('--w', '100%'); mode = 'r'; count.textContent = t('Your result');
      body.innerHTML = `<div class="quiz__step quiz__result">
        <div class="quiz__area">${t('Growth score')} · ${total}/100</div>
        <h3>${t('Your biggest leak:')} <span class="serif accent">${t(leak)}</span></h3>
        
        <ul class="quiz__bars" role="list">${scores.map(s =>
          `<li class="${s.area === leak ? 'is-leak' : ''}"><span>${t(s.area)}</span><span class="t"><i style="--v:${Math.max(s.v, 4)}%"></i></span><b>${s.v}</b></li>`).join('')}</ul>
        <div class="quiz__leak"><b>${t('Where to start:')}</b> ${t(TIPS[leak])}</div>
        <div class="quiz__actions"><a class="btn btn--navy" href="#contact" data-quiz-cta>${t('Get My Full Growth Plan')} ${arrow}</a>
        <button type="button" class="quiz__back" data-quiz-restart>${t('Retake')}</button></div></div>`;
      window.novaLeakCheck = { leak, total, scores };
      if (!silent) document.dispatchEvent(new CustomEvent('nova:leakcheck', { detail: window.novaLeakCheck }));
      $('[data-quiz-restart]', body).addEventListener('click', () => { answers = []; idx = 0; render(); });
      $('h3', body).setAttribute('tabindex', '-1'); if (!silent) $('h3', body).focus({ preventScroll: true });
    };
    $('[data-quiz-start]', quiz).addEventListener('click', () => { idx = 0; render(); });
    document.addEventListener('nova:lang', () => { if (mode === 'q') { render(true); } else if (mode === 'r') result(true); });
  }


  /* ---------- Lightbox (Work screenshots): keyboard, arrows, swipe ---------- */
  const lb = $('#lb');
  if (lb) {
    const lbImg = $('img', lb), lbCap = $('.lb__cap', lb);
    let group = [], cur = 0, lastFocus = null;
    const items = () => $$('[data-lightbox]').filter(a => $('img', a));
    const show = i => {
      cur = (i + group.length) % group.length; const a = group[cur], img = $('img', a);
      lbImg.src = img.currentSrc || img.src; lbImg.alt = img.alt; lbCap.textContent = a.dataset.caption || '';
      $('.lb__prev', lb).hidden = $('.lb__next', lb).hidden = group.length < 2;
    };
    const open = a => {
      group = items().filter(x => x.dataset.lightbox === a.dataset.lightbox); lastFocus = a;
      show(group.indexOf(a)); lb.hidden = false; requestAnimationFrame(() => lb.classList.add('is-open'));
      document.body.style.overflow = 'hidden'; $('.lb__close', lb).focus();
    };
    const close = () => { lb.classList.remove('is-open'); document.body.style.overflow = ''; setTimeout(() => lb.hidden = true, 300); lastFocus && lastFocus.focus(); };
    $$('[data-lightbox]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); if ($('img', a)) open(a); }));
    $('.lb__close', lb).addEventListener('click', close);
    $('.lb__prev', lb).addEventListener('click', () => show(cur - 1));
    $('.lb__next', lb).addEventListener('click', () => show(cur + 1));
    lb.addEventListener('click', e => { if (e.target === lb) close(); });
    addEventListener('keydown', e => {
      if (lb.hidden) return;
      if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1);
    });
    let x0 = null;
    lb.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
    lb.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); x0 = null; });
  }

  /* ---------- Testimonials carousel: autoplay, pause on hover/focus, swipe ---------- */
  $$('.tcar').forEach(car => {
    if (car.closest('[hidden]')) return;
    const track = $('.tcar__track', car), slides = $$('.tcard', car), dots = $('.tcar__dots', car);
    if (slides.length < 2) return;
    let i = 0, timer = null;
    slides.forEach((_, n) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', t('Show testimonial {n}', { n: n + 1 })); b.addEventListener('click', () => go(n)); dots.appendChild(b); });
    const go = n => { i = (n + slides.length) % slides.length; track.style.transform = `translateX(${-i * 100}%)`;
      $$('button', dots).forEach((b, k) => b.setAttribute('aria-current', k === i)); slides.forEach((s, k) => s.setAttribute('aria-hidden', k !== i)); };
    const play = () => { if (!reduce) timer = setInterval(() => go(i + 1), 6000); }, stop = () => clearInterval(timer);
    car.addEventListener('mouseenter', stop); car.addEventListener('mouseleave', play);
    car.addEventListener('focusin', stop); car.addEventListener('focusout', play);
    let x0 = null;
    car.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; stop(); }, { passive: true });
    car.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) go(i + (dx < 0 ? 1 : -1)); play(); });
    go(0); play();
  });

  /* ---------- FAQ: smooth accordion on native <details> ---------- */
  $$('.acc details').forEach(d => {
    const s = $('summary', d), body = $('.acc__body', d);
    s.addEventListener('click', e => {
      if (reduce || !body.animate) return;
      e.preventDefault();
      if (d.open) {
        const a = body.animate([{ height: body.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 300, easing: 'cubic-bezier(.2,.7,.2,1)' });
        a.onfinish = () => d.open = false;
      } else {
        $$('.acc details[open]').forEach(o => { if (o !== d) o.open = false; });
        d.open = true; const h = body.offsetHeight;
        body.animate([{ height: '0px', opacity: 0 }, { height: h + 'px', opacity: 1 }], { duration: 350, easing: 'cubic-bezier(.2,.7,.2,1)' });
      }
    });
  });


  /* ---------- Growth Plan form: live validation, prefill, Formspree AJAX ---------- */
  const formWrap = $('#growth-form');
  if (formWrap) {
    const form = $('form', formWrap), status = $('.form__status', form), btn = $('button[type=submit]', form);
    const msgs = {
      name: 'Please enter your name.', business: 'Please enter your business name.',
      email: 'Please enter a valid email address.', phone: 'Please enter a valid phone number.'
    };
    const check = input => {
      const f = input.closest('.f'), err = f && $('.f__err', f); if (!err) return true;
      const ok = input.checkValidity() && input.value.trim().length >= (+input.getAttribute('minlength') || 1);
      f.classList.toggle('is-invalid', !ok); f.classList.toggle('is-valid', ok);
      input.setAttribute('aria-invalid', !ok); err.textContent = ok ? '' : t(msgs[input.name] || 'Please check this field.');
      return ok;
    };
    $$('input[required]', form).forEach(i => {
      i.addEventListener('blur', () => { if (i.value) check(i); });
      i.addEventListener('input', () => { if (i.closest('.f').classList.contains('is-invalid')) check(i); });
    });
    const tick = v => { const c = $(`input[name="challenges[]"][value="${v}"]`, form); if (c) c.checked = true; };
    // Pillar CTAs pass their focus area
    $$('[data-focus]').forEach(a => a.addEventListener('click', () => tick(a.dataset.focus)));
    // Growth Leak Check result
    document.addEventListener('nova:leakcheck', e => {
      const { leak, total, scores } = e.detail; tick(leak);
      $('input[name=leak_check]', form).value = `Score ${total}/100 · biggest leak: ${leak} · ` + scores.map(s => `${s.area} ${s.v}`).join(', ');
      const box = $('[data-form-leak]', form); box.classList.add('is-on');
      box.dataset.leak = leak; box.innerHTML = `<b>✓</b> ${t('Your Leak Check result ({leak}) will be included.', { leak: t(leak) })}`;
    });
    document.addEventListener('nova:lang', () => {
      const box = $('[data-form-leak]', form); if (box.dataset.leak) box.innerHTML = `<b>✓</b> ${t('Your Leak Check result ({leak}) will be included.', { leak: t(box.dataset.leak) })}`;
      $$('.f.is-invalid input', form).forEach(check); status.textContent = '';
    });
    form.addEventListener('submit', async e => {
      const fields = $$('input[required]', form); const bad = fields.filter(i => !check(i));
      if (bad.length) { e.preventDefault(); bad[0].focus(); return; }
      if (form.action.includes('[FORMSPREE' + '_')) {
        e.preventDefault(); status.className = 'form__status is-error';
        status.innerHTML = t('The form is not connected yet. Please email {email} or WhatsApp us.', { email: '<a href="mailto:growthsolutionsnova@gmail.com">growthsolutionsnova@gmail.com</a>' });
        return;
      }
      if (!window.fetch) return; // native POST fallback
      e.preventDefault(); btn.classList.add('is-loading'); btn.disabled = true; status.textContent = ''; status.className = 'form__status';
      try {
        const res = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error();
        formWrap.classList.add('is-sent'); $('.form__done', formWrap).focus();
      } catch (_) {
        status.className = 'form__status is-error';
        status.innerHTML = t('Something went wrong. Please try again or WhatsApp us at {wa}.', { wa: '<a href="https://wa.me/17043904390">(704) 390-4390</a>' });
      } finally { btn.classList.remove('is-loading'); btn.disabled = false; }
    });
  }

  /* ---------- Mobile quick-contact bar appears after the hero ---------- */
  const mbar = $('.mbar'), hero = $('.hero');
  if (mbar && hero && 'IntersectionObserver' in window) {
    new IntersectionObserver(([en]) => mbar.classList.toggle('is-on', !en.isIntersecting), { threshold: .15 }).observe(hero);
  }
  $$('[data-year]').forEach(y => y.textContent = new Date().getFullYear());

  /* ---------- Apply initial language (after every widget is set up) ---------- */
  if (initialLang !== 'en') setLang(initialLang);

  /* ---------- Scroll reveal ---------- */
  const reveals = $$('.reveal');
  if ('IntersectionObserver' in window && !reduce) {
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); }
    }), { threshold: .15, rootMargin: '0px 0px -8% 0px' });
    reveals.forEach(r => io.observe(r));
  } else reveals.forEach(r => r.classList.add('is-in'));
})();
</script>
</body>
</html>
